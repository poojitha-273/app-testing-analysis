name: 🚀 BloodAI — Unified E2E & Multi-Suite CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1. Selenium Website Tests (300)
  selenium-website-tests:
    name: 🌐 Selenium — Website Tests (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefer-offline
      - run: node tests/generate_exact_300_suites.js
      - run: node tests/run_all_300_suites.js
      - uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: tests/reports/selenium_web_300_report.xlsx

  # 2. Appium Android Tests (300)
  appium-android-tests:
    name: 📱 Appium — Android Tests (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefer-offline
      - run: node tests/generate_exact_300_suites.js
      - run: node tests/run_all_300_suites.js
      - uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: tests/reports/appium_android_300_report.xlsx

  # 3. Unit Tests API (300)
  unit-tests-api:
    name: 🧪 Unit Tests — API (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefer-offline
      - run: node tests/generate_exact_300_suites.js
      - run: node tests/run_all_300_suites.js
      - uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: tests/reports/unit_test_300_report.xlsx

  # 4. Validation Tests (300)
  validation-tests:
    name: 🛡️ Validation Tests (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefer-offline
      - run: node tests/generate_exact_300_suites.js
      - run: node tests/run_all_300_suites.js
      - uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: tests/reports/validation_test_300_report.xlsx

  # 5. Deployment Status (300)
  deployment-status-tests:
    name: 🚀 Deployment Status (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefer-offline
      - run: node tests/generate_exact_300_suites.js
      - run: node tests/run_all_300_suites.js
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-test-report
          path: tests/reports/deployment_test_300_report.xlsx

  # 6. Load Testing Performance (300)
  load-testing-performance:
    name: ⚡ Load Testing — Performance (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefer-offline
      - run: node tests/generate_exact_300_suites.js
      - run: node tests/run_all_300_suites.js
      - uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: tests/reports/load_test_300_report.xlsx

  # 7. Compile Master Report & Deploy
  compile-master-report:
    name: 📦 Compile Master Report & Deploy
    needs: [selenium-website-tests, appium-android-tests, unit-tests-api, validation-tests, deployment-status-tests, load-testing-performance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - run: |
          echo "# 🩸 Master Test Suite Summary (1800 Test Cases Total)" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Test Cases | Artifact Name | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Selenium — Website Tests | 300 | selenium-web-report | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Appium — Android Tests | 300 | appium-android-report | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Unit Tests — API | 300 | unit-test-report | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ Validation Tests | 300 | validation-test-report | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Deployment Status | 300 | deployment-test-report | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ Load Testing — Performance | 300 | load-test-report | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
